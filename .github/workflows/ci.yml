name: CI / Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo_user
          POSTGRES_PASSWORD: peblo_pass
          POSTGRES_DB: peblo_tv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Lint Backend
        run: |
          ruff check backend/app

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: ci-test-secret-key-12345
          STORAGE_PATH: ./storage
          CATALOGUE_PATH: ./storage/catalogue.json
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: adminpassword123
          EDITOR_EMAIL: editor@example.com
          EDITOR_PASSWORD: editorpassword123
        run: |
          mkdir -p storage
          pytest -v backend/tests

  frontend-build:
    name: Frontend (CMS & Viewer) Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            cms/package.json
            viewer/package.json

      - name: Build CMS
        working-directory: ./cms
        run: |
          npm ci
          npm run build

      - name: Build Viewer
        working-directory: ./viewer
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: peblo-backend:ci

      - name: Build CMS Image
        uses: docker/build-push-action@v5
        with:
          context: ./cms
          push: false
          tags: peblo-cms:ci

      - name: Build Viewer Image
        uses: docker/build-push-action@v5
        with:
          context: ./viewer
          push: false
          tags: peblo-viewer:ci
